<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
  </head>
  <body>
    <div id="alertArea" class="alert-area"></div>
    <section id="loginScreen" class="login-wrap">
      <div class="login-card">
        <div class="d-flex align-items-center gap-3 mb-4"><div class="brand-mark">C</div><div><div class="fw-bold fs-5">Institution Manager</div><div class="text-secondary small">Sign in to your workspace</div></div></div>
        <form id="loginForm">
          <div class="mb-3"><label class="form-label">Email address</label><input id="loginEmail" type="email" class="form-control" autocomplete="username" required></div>
          <div class="mb-4"><label class="form-label">Password</label><input id="loginPassword" type="password" class="form-control" autocomplete="current-password" required></div>
          <button id="loginButton" class="btn btn-primary w-100 py-2" type="submit">Sign in</button>
        </form>
        <div class="small text-secondary mt-4">Create the first administrator from the spreadsheet's Apps Script editor.</div>
      </div>
    </section>
    <div id="appShell" class="app-shell d-none">
      <aside id="sidebar" class="sidebar">
        <div class="side-brand"><span class="brand-mark">C</span><span>Institution Manager</span></div>
        <div class="nav-caption">Workspace</div>
        <button class="nav-link active" data-page="dashboard">▦ &nbsp; Dashboard</button>
        <button class="nav-link" data-page="students">♙ &nbsp; Students</button>
        <button class="nav-link" data-page="courses">▤ &nbsp; Courses</button>
        <button class="nav-link admin-only" data-page="batches">▥ &nbsp; Batches</button>
        <button class="nav-link" data-page="sessions">◷ &nbsp; Sessions</button>
        <button class="nav-link financial-only" data-page="fees">₹ &nbsp; Fee collection</button>
        <button class="nav-link admin-only" data-page="feeSetup">⚙ &nbsp; Fee setup</button>
        <button class="nav-link financial-only" data-page="income">↗ &nbsp; Income</button>
        <button class="nav-link financial-only" data-page="expenses">↘ &nbsp; Expenses</button>
        <button class="nav-link financial-only" data-page="staff">♧ &nbsp; Staff</button>
        <button class="nav-link financial-only" data-page="payroll">▣ &nbsp; Payroll</button>
        <button class="nav-link financial-only" data-page="accounts">▤ &nbsp; Accounts & cash book</button>
        <button class="nav-link financial-only" data-page="transactions">⇄ &nbsp; Transactions</button>
        <button class="nav-link financial-only" data-page="reports">▥ &nbsp; Reports</button>
        <button class="nav-link admin-only" data-page="users">♙ &nbsp; Users</button>
        <button class="nav-link admin-only" data-page="backup">⤓ &nbsp; Backup</button>
        <button class="nav-link admin-only" data-page="settings">⚙ &nbsp; Institution settings</button>
        <div class="side-foot"><div id="sidebarUser" class="small fw-semibold text-white"></div><div id="sidebarRole" class="small text-secondary mb-3"></div><button id="logoutButton" class="nav-link">↪ &nbsp; Sign out</button></div>
      </aside>
      <main class="main">
        <header class="topbar"><div class="d-flex align-items-center gap-3"><button id="menuButton" class="btn btn-light mobile-menu">☰</button><div id="institutionTitle" class="fw-semibold">Computer Institution Management</div></div>
          <div class="d-flex align-items-center gap-3"><select id="sessionSelect" class="form-select form-select-sm" style="width:auto;min-width:135px"></select><span id="topUser" class="small text-secondary"></span></div>
        </header>
        <div id="pageContent" class="content"></div>
      </main>
    </div>
    <script src="/js/modules.js" defer></script>
    <script src="/js/app.js" defer></script>
  </body>
</html>
